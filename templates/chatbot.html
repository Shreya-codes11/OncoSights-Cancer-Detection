<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oncosights Chatbot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-image: url('/static/chatbot.jpg'); /* Replace with your image URL */
            background-size: cover;
            background-position: center;
            background-attachment: fixed; /* Keeps the background fixed as content scrolls */
        }
    </style>
</head>
<body class="flex flex-col min-h-screen bg-gray-200">

    <section class="h-screen flex justify-center items-center w-full">
        <div class="container mx-auto p-4 ">
            <h1 class="text-4xl font-bold text-center mb-4 text-white">Oncosights - Cancer Specialist Chatbot</h1>
            <div id="chatbox" class="bg-gray-50 p-4 rounded-lg shadow-md mb-4" style="height: 400px; overflow-y: auto;">
                <!-- Chat messages will appear here -->
            </div>
            <form id="chat-form" class="flex">
                <input type="text" id="user-input" class="flex-grow p-2 border border-gray-300 rounded-l-lg" placeholder="Ask a question..." required>
                <button type="submit" class="bg-blue-500 text-white p-2 rounded-r-lg">Send</button>
            </form>
        </div>
    </section>
    

    <script>
        const chatForm = document.getElementById('chat-form');
const userInput = document.getElementById('user-input');
const chatbox = document.getElementById('chatbox');

// Handle form submission
chatForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const userMessage = userInput.value.trim();
    if (!userMessage) return;

    // Display user message
    chatbox.innerHTML += `<div class="text-right text-blue-500 border border-blue-300 p-2 rounded-md mb-2">You: ${userMessage}</div>`;
    userInput.value = '';

    // Fetch chatbot response from Flask backend
    const response = await fetch('/chatbot', {
        method: 'POST',
        body: new URLSearchParams({ 'user_input': userMessage }),
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
    });

    // Get the response from the backend
    const data = await response.json();
    
    // Format and display chatbot response
    const botResponse = formatResponse(data.response);
    chatbox.innerHTML += botResponse;
    
    // Scroll to the latest message
    chatbox.scrollTop = chatbox.scrollHeight;
});

// Function to format the chatbot response
function formatResponse(responseText) {
    // Split response into lines based on "* " (which represents list items)
    const lines = responseText.split('* ').filter(line => line.trim() !== '');
    
    // Generate formatted list items
    const formattedList = lines.map(line => `<li class="mb-2 text-gray-700"> ${line.trim()}</li>`).join('');
    
    return `<div class="text-left bg-gray-200 border border-gray-400 p-3 rounded-md mb-2">
                <p class="font-semibold text-gray-800">Oncosights:</p>
                <ul class="list-disc pl-5">${formattedList}</ul>
            </div>`;
}

    </script>
</body>
</html>
