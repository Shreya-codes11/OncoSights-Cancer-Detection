<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <style>
        .divider:after,
        .divider:before {
            content: "";
            flex: 1;
            height: 1px;
            background: #eee;
        }
        .vh-100 {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f8f9fa;
        }
        .form-control-lg, .btn-lg {
            border-radius: 10px;
            width: 100%;
            height: calc(2.875rem + 2px);
            font-size: 1.25rem;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <section class="vh-100">
        <div class="container py-5 h-100">
            <div class="row d-flex align-items-center justify-content-center h-100">
                <div class="col-md-8 col-lg-7 col-xl-6">
                    <img src="/static/login.png" class="img-fluid" alt="Phone image">
                </div>
                <div class="col-md-7 col-lg-5 col-xl-5 offset-xl-1">
                    <h2 class="text-center mb-4">Admin Login Only!</h2>
                    <form onsubmit="return validateLogin(event)">
                        <div class="form-outline mb-4">
                            <input type="email" id="email" class="form-control form-control-lg" placeholder="Enter your email" required />
                        </div>
                        <div class="form-outline mb-4">
                            <input type="password" id="password" class="form-control form-control-lg" placeholder="Enter your password" required />
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg">Sign in</button>
                    </form>
                </div>
            </div>
        </div>
    </section>
    
    <script>
        function validateLogin(event) {
            event.preventDefault();
            
            const admins = [
                { email: "admin1@gmail.com", password: "password1" },
                { email: "admin2@gmail.com", password: "password2" },
                { email: "admin3@gmail.com", password: "password3" },
                { email: "admin4@gmail.com", password: "password4" }
            ];
            
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            
            const isValid = admins.some(admin => admin.email === email && admin.password === password);
             
            if (isValid) {
                window.location.href ="/history";
            } else {
                alert("Invalid credentials. Please try again.");
            }
        }
    </script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
